syntax = "proto3";

package coor;

/** Raft RequestVote */
message RaftRequestVote
{
    uint64 term           = 1;
    string candidate_id   = 2;
    uint64 last_log_index = 3;
    uint64 last_log_term  = 4;
    uint32 next_node_id_alloc_hint = 5; ///< 投票方用于选主后对齐游标
}

message RaftRequestVoteRsp
{
    uint64 term         = 1;
    bool vote_granted   = 2;
    uint32 voter_next_node_id_alloc_hint = 3;
}

/** Leader -> Follower：在线节点全量快照中的一条（与 NodeReport 核心字段对齐，不含 node/workers 负载细项） */
message RaftOnlineNodeEntry
{
    string node_type   = 1;
    uint32 node_id     = 2;
    string node_ip     = 3;
    uint32 node_port   = 4;
    string access_ip   = 5;
    uint32 access_port = 6;
    uint32 worker_num  = 7;
    double active_time = 8;
}

/** Raft AppendEntries（可为空日志的心跳） */
message RaftAppendEntries
{
    uint64 term            = 1;
    string leader_id       = 2;
    uint64 prev_log_index  = 3;
    uint64 prev_log_term   = 4;
    uint64 leader_commit   = 5;
    uint32 leader_next_node_id_alloc = 6; ///< Leader 侧下一待分配游标，Follower 取 max 对齐
    /** 非 0 表示携带一次在线表全量快照；Follower 用其整体替换本地副本（与 Center-Raft 文档「主下发全量路由」一致） */
    uint64 online_nodes_seq = 7;
    repeated RaftOnlineNodeEntry online_nodes = 8;
}

message RaftAppendEntriesRsp
{
    uint64 term   = 1;
    bool success  = 2;
}

