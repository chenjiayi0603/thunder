version: '3.8'

services:
  thunder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thunder-server
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=INFO
      - SERVER_PORT=8080
    volumes:
      - ./logs:/app/logs
    networks:
      - thunder-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  thunder-network:
    driver: bridge

