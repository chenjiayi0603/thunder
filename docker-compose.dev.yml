# Thunder 开发环境 — 一键启动
# 用法: docker compose -f docker-compose.dev.yml up -d
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    command: etcd --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://127.0.0.1:2379
    ports: ["2379:2379"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]

  hello:
    build: {context: ., dockerfile: deploy/HelloHttp/Dockerfile}
    network_mode: host
    environment:
      ETCD_ENDPOINT: http://127.0.0.1:2379
      POD_IP: 127.0.0.1
    depends_on: [etcd]

  logic:
    build: {context: ., dockerfile: deploy/Logic/Dockerfile}
    network_mode: host
    environment:
      ETCD_ENDPOINT: http://127.0.0.1:2379
      POD_IP: 127.0.0.1
    depends_on: [etcd]

  interface:
    build: {context: ., dockerfile: deploy/Interface/Dockerfile}
    network_mode: host
    environment:
      ETCD_ENDPOINT: http://127.0.0.1:2379
      POD_IP: 127.0.0.1
    depends_on: [etcd]
