<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thunder Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#333}
.header{background:#1a1a2e;color:#fff;padding:16px 24px;font-size:20px;font-weight:bold}
.header span{color:#e94560}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e0e0e0;padding:0 24px}
.tab{padding:12px 20px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-size:14px;color:#666;transition:.2s}
.tab:hover{color:#1a1a2e}
.tab.active{color:#e94560;border-bottom-color:#e94560;font-weight:bold}
.content{padding:24px;max-width:1200px}
.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:16px;margin-bottom:12px;color:#1a1a2e}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f0f0f0}
th{background:#fafafa;font-weight:600;color:#555}
tr:hover{background:#f8f9ff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.badge-ok{background:#e6f7e6;color:#2e7d32}
.badge-warn{background:#fff3e0;color:#e65100}
.btn{padding:6px 16px;border:none;border-radius:4px;cursor:pointer;font-size:13px;transition:.2s}
.btn-primary{background:#e94560;color:#fff}
.btn-primary:hover{background:#d63850}
.btn-sm{padding:3px 10px;font-size:12px}
input,textarea{width:100%;padding:8px 12px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;font-family:monospace}
input:focus,textarea:focus{outline:none;border-color:#e94560;box-shadow:0 0 0 2px rgba(233,69,96,.1)}
.flex{display:flex;gap:12px;align-items:center}
.mt12{margin-top:12px}
.mb8{margin-bottom:8px}
.toast{position:fixed;top:16px;right:16px;padding:12px 20px;border-radius:6px;color:#fff;font-size:13px;z-index:999;animation:slideIn .3s}
.toast-ok{background:#2e7d32}
.toast-err{background:#d32f2f}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-content{background:#fff;border-radius:8px;padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 4px 20px rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="header">⚡ Thunder <span>Admin</span> <small style="font-size:11px;color:#888;font-weight:normal">直连 etcd</small></div>
<div class="tabs">
  <div class="tab active" data-tab="nodes">🖥 节点</div>
  <div class="tab" data-tab="status">📊 状态</div>
</div>
<div class="content" id="content"></div>

<script>
// ── etcd 直连配置 ──
// 支持 URL 参数指定 etcd 地址: ?etcd=192.168.1.100:2379
const p = new URLSearchParams(location.search);
const ETCD = 'http://' + (p.get('etcd') || location.hostname + ':2379');
document.querySelector('.header small').textContent = '直连 ' + ETCD;
let currentTab = 'nodes';

// ── base64 (etcd API 要求) ──
function b64Encode(str) {
  return btoa(String.fromCharCode(...new TextEncoder().encode(str)));
}
function b64Decode(str) {
  return new TextDecoder().decode(Uint8Array.from(atob(str), c => c.charCodeAt(0)));
}

// ── etcd HTTP helper ──
async function etcdPost(path, body) {
  try {
    const r = await fetch(ETCD + path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    return await r.json();
  } catch(e) {
    console.error('etcdPost failed:', e);
    return null;
  }
}

function toast(msg, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ── 节点列表 ──
async function loadNodes() {
  const d = await etcdPost('/v3/kv/range', {
    key: b64Encode('/thunder/registry/'),
    range_end: b64Encode('/thunder/registry0')
  });
  if (!d || !d.kvs) {
    document.getElementById('content').innerHTML = '<div class="card"><p style="color:#999">无法获取节点数据 (etcd 不可达?)</p></div>';
    return;
  }
  // 按类型分组
  var types = {}, typeOrder = [];
  d.kvs.forEach(kv => {
    var v = JSON.parse(b64Decode(kv.value));
    var t = v.node_type;
    if (!types[t]) { types[t] = []; typeOrder.push(t); }
    types[t].push(v);
  });

  var h = '<div class="card"><h3>📋 注册节点列表 (' + d.kvs.length + ')</h3>';
  if (d.kvs.length === 0) { h += '<p style="color:#999">暂无注册节点</p></div>'; }
  else {
    h += '<table><tr><th>类型/节点</th><th>IP:Port</th><th>ID</th><th>W</th><th>模块</th><th>配置</th></tr>';
    typeOrder.forEach(function(t) {
      var nodes = types[t];
      // 类型头行
      h += '<tr style="background:#f8f9ff;font-weight:bold">';
      h += '<td><span class="badge badge-' + (t==='LOGIC'?'ok':'warn') + '">' + t + '</span> (' + nodes.length + '节点)</td>';
      h += '<td colspan="2"></td><td></td>';
      h += '<td><button class="btn btn-sm" onclick="openModuleConfig(\'' + escJs(t) + '\')">⚙ 模块</button></td>';
      h += '<td></td></tr>';
      // 节点行
      nodes.forEach(function(v) {
        var addr = v.node_ip + ':' + v.node_port;
        h += '<tr>';
        h += '<td style="padding-left:24px;font-size:12px;color:#888">' + addr + '</td>';
        h += '<td>' + addr + '</td>';
        h += '<td>' + (v.node_id||'?') + '</td>';
        h += '<td>' + (v.worker_num||0) + '</td>';
        h += '<td></td>';
        h += '<td><button class="btn btn-primary btn-sm" onclick="openNodeConfig(\'' + escJs(t) + '\',\'' + escJs(addr) + '\')">⚙ 配置</button></td>';
        h += '</tr>';
      });
    });
    h += '</table></div>';
  }
  h += nodeConfigModalHtml();
  h += moduleConfigModalHtml();
  document.getElementById('content').innerHTML = h;
}

// ── SO 模块配置 Modal ──
// 上传服务器地址 (默认同主机 8090, 可通过 ?upload=host:port 指定)
const UPLOAD = 'http://' + ((new URLSearchParams(location.search)).get('upload') || (location.hostname + ':8090'));
// 节点类型 → NFS 子目录映射
const TYPE_DIR = {HELLO:'HelloHttp',LOGIC:'Logic',INTERFACE:'Interface',HELLO_WS:'HelloWs',HELLO_HTTPS:'HelloHttps'};

function moduleConfigModalHtml() {
  return '<div id="modCfgModal" class="modal"><div class="modal-content" style="max-width:700px"><h3 id="modCfgTitle">⚙ 模块配置</h3>'
    + '<div id="modCfgBody"></div></div></div>';
}

async function openModuleConfig(type) {
  var cfgKey = '/thunder/config/module/' + type;
  var d = await etcdPost('/v3/kv/range', {key: b64Encode(cfgKey)});
  var currentJson = '{\n  "module": []\n}';
  if (d && d.kvs && d.kvs.length > 0) {
    currentJson = b64Decode(d.kvs[0].value);
    try { currentJson = JSON.stringify(JSON.parse(currentJson), null, 2); } catch(e) {}
  }
  // 版本历史计数
  var histKey = '/thunder/config_history/module/' + type + '/';
  var hd = await etcdPost('/v3/kv/range', {
    key: b64Encode(histKey), range_end: b64Encode(histKey.slice(0,-1)+'0')
  });
  var vc = (hd && hd.kvs) ? hd.kvs.length : 0;
  var typeDir = TYPE_DIR[type] || type;
  document.getElementById('modCfgTitle').innerHTML = '⚙ ' + type + ' SO 模块';
  var h = '<div style="font-size:11px;color:#999;margin-bottom:4px;font-family:monospace">' + escHtml(cfgKey) + '</div>';
  h += '<div style="font-size:12px;margin-bottom:8px"><b>版本:</b> <span style="color:#e94560">' + (vc > 0 ? 'v' + (vc+1) : 'v1') + ' (当前)</span></div>';
  // 文件上传区域
  h += '<div class="card" style="padding:12px;margin-bottom:10px;background:#f8f9ff">';
  h += '<b style="font-size:13px">📤 上传 SO 到 NFS</b> ';
  h += '<span style="font-size:11px;color:#999">(' + UPLOAD + '/plugins/' + typeDir + '/)</span><br>';
  h += '<div class="flex" style="margin-top:6px">';
  h += '<input type="file" id="soFileInput" accept=".so" style="width:auto;font-family:inherit">';
  h += '<button class="btn btn-primary btn-sm" onclick="uploadSo(\'' + escJs(type) + '\')">⬆ 上传</button>';
  h += '</div><div id="uploadStatus" style="font-size:12px;margin-top:4px;color:#999"></div></div>';
  // JSON 编辑区
  h += '<textarea id="modCfgJson" rows="12" style="width:100%;font-family:monospace;font-size:13px">' + escHtml(currentJson) + '</textarea>';
  h += '<div class="flex mt12"><button class="btn btn-primary" onclick="saveModuleCfg(\'' + escJs(type) + '\')">💾 保存 (触发 GracefulRestart)</button>';
  h += '<button class="btn btn-sm" onclick="showModuleVersions(\'' + escJs(type) + '\')">📋 版本历史 (' + vc + ')</button></div>';
  document.getElementById('modCfgBody').innerHTML = h;
  document.getElementById('modCfgModal').style.display = 'flex';
}

async function uploadSo(type) {
  var fileInput = document.getElementById('soFileInput');
  var status = document.getElementById('uploadStatus');
  var file = fileInput.files[0];
  if (!file) { status.innerHTML = '<span style="color:#d32f2f">请先选择 .so 文件</span>'; return; }
  status.textContent = '上传中...';
  var typeDir = TYPE_DIR[type] || type;
  var url = UPLOAD + '/plugins/' + typeDir + '/' + file.name;
  try {
    var r = await fetch(url, {method:'PUT', body:file});
    var j = await r.json();
    if (j.ok) {
      status.innerHTML = '<span style="color:#2e7d32">✅ ' + file.name + ' (' + (j.size/1024).toFixed(0) + ' KB) 已上传</span>';
      // 自动填入 so_path 和 version
      var ta = document.getElementById('modCfgJson');
      var cfg = JSON.parse(ta.value);
      var mod = cfg.module && cfg.module[0] ? cfg.module[0] : (cfg.module = [{}], cfg.module[0]);
      mod.so_path = 'plugins/' + file.name;
      mod.version = (mod.version || 0) + 1;
      ta.value = JSON.stringify(cfg, null, 2);
    } else {
      status.innerHTML = '<span style="color:#d32f2f">❌ 上传失败</span>';
    }
  } catch(e) {
    status.innerHTML = '<span style="color:#d32f2f">❌ ' + (e.message || '无法连接上传服务器 (' + UPLOAD + ')') + '</span>';
  }
}

async function saveModuleCfg(type) {
  var cfgKey = '/thunder/config/module/' + type;
  var newVal = document.getElementById('modCfgJson').value;
  try { JSON.parse(newVal); } catch(e) { toast('JSON 格式错误', false); return; }
  // 备份旧值
  var oldR = await etcdPost('/v3/kv/range', {key: b64Encode(cfgKey)});
  if (oldR && oldR.kvs && oldR.kvs.length > 0) {
    var oldVal = b64Decode(oldR.kvs[0].value);
    if (oldVal && oldVal !== newVal) {
      await etcdPost('/v3/kv/put', {
        key: b64Encode('/thunder/config_history/module/' + type + '/v' + Date.now()),
        value: b64Encode(oldVal)
      });
    }
  }
  var r = await etcdPost('/v3/kv/put', {key: b64Encode(cfgKey), value: b64Encode(newVal)});
  if (r) { toast(type + ' 模块版本已更新, GracefulRestart 触发中', true); document.getElementById('modCfgModal').style.display = 'none'; }
  else { toast('保存失败', false); }
}

async function showModuleVersions(type) {
  var cfgKey = '/thunder/config/module/' + type;
  var histKey = '/thunder/config_history/module/' + type + '/';
  var d = await etcdPost('/v3/kv/range', {
    key: b64Encode(histKey), range_end: b64Encode(histKey.slice(0,-1)+'0')
  });
  var h = '<p style="font-size:12px">' + escHtml(type) + ' 模块版本历史</p><hr class="mb8">';
  if (d && d.kvs && d.kvs.length > 0) {
    h += '<table><tr><th>版本</th><th>时间</th><th>预览</th><th>操作</th></tr>';
    for (var i = d.kvs.length - 1; i >= 0; i--) {
      var kv = d.kvs[i];
      var vk = b64Decode(kv.key).replace(histKey, '');
      var ts = parseInt(vk.substring(1));
      var val = b64Decode(kv.value);
      h += '<tr><td style="font-size:11px;font-family:monospace">' + escHtml(vk) + '</td>';
      h += '<td style="font-size:11px">' + new Date(ts).toLocaleString() + '</td>';
      h += '<td style="font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escHtml(val.substring(0,50)) + '</td>';
      h += '<td><button class="btn btn-primary btn-sm" onclick="rollbackModuleCfg(\'' + escJs(type) + '\',\'' + escJs(val) + '\')">↩ 回滚</button></td></tr>';
    }
    h += '</table>';
  } else { h += '<p style="color:#999">暂无历史版本</p>'; }
  document.getElementById('versionList').innerHTML = h;
  document.getElementById('versionModal').style.display = 'flex';
}

async function rollbackModuleCfg(type, oldVal) {
  if (!confirm('确要回滚 SO 模块版本？此操作将触发 GracefulRestart。')) return;
  var cfgKey = '/thunder/config/module/' + type;
  var cur = await etcdPost('/v3/kv/range', {key: b64Encode(cfgKey)});
  if (cur && cur.kvs && cur.kvs.length > 0) {
    var cv = b64Decode(cur.kvs[0].value);
    if (cv !== oldVal) {
      await etcdPost('/v3/kv/put', {
        key: b64Encode('/thunder/config_history/module/' + type + '/v' + Date.now()),
        value: b64Encode(cv)
      });
    }
  }
  var r = await etcdPost('/v3/kv/put', {key: b64Encode(cfgKey), value: b64Encode(oldVal)});
  if (r) { toast('已回滚, GracefulRestart 触发中', true); closeVersionModal(); }
  else { toast('回滚失败', false); }
}

// ── 节点配置 Modal ──
function nodeConfigModalHtml() {
  return '<div id="nodeCfgModal" class="modal"><div class="modal-content" style="max-width:700px"><h3 id="nodeCfgTitle">⚙ 节点配置</h3>'
    + '<div id="nodeCfgBody"></div></div></div>'
    + '<div id="versionModal" class="modal"><div class="modal-content"><h3>📋 版本历史</h3><div id="versionList"></div>'
    + '<button class="btn mt12" onclick="closeVersionModal()" style="background:#ddd">关闭</button></div></div>';
}

async function openNodeConfig(type, addr) {
  var cfgKey = '/thunder/config/' + addr;
  var d = await etcdPost('/v3/kv/range', {key: b64Encode(cfgKey)});
  var currentJson = '{}', hasConfig = false;
  if (d && d.kvs && d.kvs.length > 0) {
    currentJson = b64Decode(d.kvs[0].value);
    hasConfig = true;
    try { currentJson = JSON.stringify(JSON.parse(currentJson), null, 2); } catch(e) {}
  }
  // 获取版本号
  var histKey = '/thunder/config_history/' + addr + '/';
  var hd = await etcdPost('/v3/kv/range', {
    key: b64Encode(histKey), range_end: b64Encode(histKey.slice(0,-1)+'0')
  });
  var versionCount = (hd && hd.kvs) ? hd.kvs.length : 0;
  var verLabel = hasConfig ? ('v' + (versionCount + 1) + ' (当前)') : '无版本';
  if (hd && hd.kvs && hd.kvs.length > 0) {
    var lastVer = b64Decode(hd.kvs[hd.kvs.length-1].key).replace(histKey,'');
    verLabel += ' | 最后修改: ' + new Date(parseInt(lastVer.substring(1))).toLocaleString();
  }

  document.getElementById('nodeCfgTitle').innerHTML = '⚙ ' + type + ' ' + addr + ' 配置';
  var h = '<div style="font-size:11px;color:#999;margin-bottom:4px;font-family:monospace">' + escHtml(cfgKey) + '</div>';
  h += '<div style="font-size:12px;margin-bottom:8px"><b>版本:</b> <span style="color:#e94560">' + verLabel + '</span></div>';
  h += '<textarea id="nodeCfgJson" rows="14" style="width:100%;font-family:monospace;font-size:13px">' + escHtml(currentJson) + '</textarea>';
  h += '<div class="flex mt12"><button class="btn btn-primary" onclick="saveNodeCfg(\'' + escJs(type) + '\',\'' + escJs(addr) + '\')">💾 保存</button>';
  h += '<button class="btn btn-sm" onclick="showNodeVersions(\'' + escJs(addr) + '\')">📋 版本历史 (' + versionCount + ')</button>';
  h += '<span style="font-size:11px;color:#999">保存时自动备份旧值</span></div>';
  document.getElementById('nodeCfgBody').innerHTML = h;
  document.getElementById('nodeCfgModal').style.display = 'flex';
}

async function saveNodeCfg(type, addr) {
  var cfgKey = '/thunder/config/' + addr;
  var newVal = document.getElementById('nodeCfgJson').value;
  try { JSON.parse(newVal); } catch(e) { toast('JSON 格式错误: ' + e.message, false); return; }
  // 备份旧值
  var oldR = await etcdPost('/v3/kv/range', {key: b64Encode(cfgKey)});
  if (oldR && oldR.kvs && oldR.kvs.length > 0) {
    var oldVal = b64Decode(oldR.kvs[0].value);
    if (oldVal && oldVal !== newVal) {
      await etcdPost('/v3/kv/put', {
        key: b64Encode('/thunder/config_history/' + addr + '/v' + Date.now()),
        value: b64Encode(oldVal)
      });
    }
  }
  var r = await etcdPost('/v3/kv/put', {key: b64Encode(cfgKey), value: b64Encode(newVal)});
  if (r) { toast('已保存', true); document.getElementById('nodeCfgModal').style.display = 'none'; }
  else { toast('保存失败', false); }
}

// 节点配置版本历史
async function showNodeVersions(addr) {
  var histKey = '/thunder/config_history/' + addr + '/';
  var d = await etcdPost('/v3/kv/range', {
    key: b64Encode(histKey), range_end: b64Encode(histKey.slice(0,-1)+'0')
  });
  var h = '<p style="font-size:12px;font-family:monospace;word-break:break-all">' + escHtml(addr) + '</p><hr class="mb8">';
  if (d && d.kvs && d.kvs.length > 0) {
    h += '<table><tr><th>版本</th><th>时间</th><th>预览</th><th>操作</th></tr>';
    // 倒序显示 (最新在前)
    for (var i = d.kvs.length - 1; i >= 0; i--) {
      var kv = d.kvs[i];
      var verKey = b64Decode(kv.key);
      var verName = verKey.replace(histKey, '');
      var ts = parseInt(verName.substring(1));
      var timeStr = new Date(ts).toLocaleString();
      var val = b64Decode(kv.value);
      var preview = val.length > 50 ? val.substring(0,50) + '...' : val;
      h += '<tr><td style="font-size:11px;font-family:monospace">' + escHtml(verName) + '</td>';
      h += '<td style="font-size:11px">' + timeStr + '</td>';
      h += '<td style="font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escHtml(preview) + '</td>';
      h += '<td><button class="btn btn-primary btn-sm" onclick="rollbackNodeCfg(\'' + escJs(addr) + '\',\'' + escJs(val) + '\')">↩ 回滚</button></td></tr>';
    }
    h += '</table>';
  } else { h += '<p style="color:#999">暂无历史版本</p>'; }
  document.getElementById('versionList').innerHTML = h;
  document.getElementById('versionModal').style.display = 'flex';
}

async function rollbackNodeCfg(addr, oldVal) {
  if (!confirm('确要回滚到此版本？当前值将被覆盖。')) return;
  var cfgKey = '/thunder/config/' + addr;
  // 先备份当前值
  var cur = await etcdPost('/v3/kv/range', {key: b64Encode(cfgKey)});
  if (cur && cur.kvs && cur.kvs.length > 0) {
    var curVal = b64Decode(cur.kvs[0].value);
    if (curVal !== oldVal) {
      await etcdPost('/v3/kv/put', {
        key: b64Encode('/thunder/config_history/' + addr + '/v' + Date.now()),
        value: b64Encode(curVal)
      });
    }
  }
  var r = await etcdPost('/v3/kv/put', {key: b64Encode(cfgKey), value: b64Encode(oldVal)});
  if (r) { toast('已回滚', true); closeVersionModal(); }
  else { toast('回滚失败', false); }
}

// 关闭modal
document.addEventListener('click', function(e) {
  if (e.target.id === 'nodeCfgModal') document.getElementById('nodeCfgModal').style.display = 'none';
  if (e.target.id === 'modCfgModal') document.getElementById('modCfgModal').style.display = 'none';
  if (e.target.id === 'versionModal') closeVersionModal();
});

// ── 配置列表 ──
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escJs(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

let selectedType = 'ALL';
let selectedNode = '';

async function loadConfig() {
  const prefix = selectedType === 'ALL'
    ? '/thunder/config/'
    : '/thunder/config/' + selectedType + '/' + (selectedNode || '');
  const d = await etcdPost('/v3/kv/range', {
    key: b64Encode(prefix),
    range_end: b64Encode(prefix.slice(0,-1) + '0')
  });
  let items = [];
  if (d && d.kvs) {
    items = d.kvs.map(function(kv) {
      return {key: b64Decode(kv.key), value: b64Decode(kv.value)};
    });
  }
  var h = '<div class="card"><h3>⚙ 节点配置下发</h3>';
  h += '<div class="flex mb8" style="flex-wrap:wrap"><b>节点类型:</b>';
  h += '<select id="typeSelect" onchange="onTypeChange()" style="width:auto;font-family:monospace">';
  ['ALL','HELLO','INTERFACE','LOGIC'].forEach(function(t) {
    h += '<option value="' + t + '"' + (selectedType===t?' selected':'') + '>' + t + '</option>';
  });
  h += '</select>';
  if (selectedType !== 'ALL') {
    h += ' <b>节点:</b><select id="nodeSelect" onchange="onNodeChange()" style="width:auto;font-family:monospace;max-width:250px">';
    h += '<option value="">(所有)</option></select>';
  }
  h += ' <span style="color:#999;font-size:12px">' + items.length + ' 条</span></div>';
  h += '<table><tr><th>Key</th><th>Value</th><th>版本</th><th>操作</th></tr>';
  if (items.length > 0) {
    items.forEach(function(item) {
      var shortKey = item.key;
      if (shortKey.indexOf(prefix) === 0) shortKey = shortKey.substring(prefix.length);
      h += '<tr><td style="font-family:monospace;font-size:12px">' + escHtml(shortKey) + '</td>';
      h += '<td style="max-width:350px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escHtml(item.value) + '</td>';
      h += '<td><button class="btn btn-sm" onclick="showVersions(\'' + escJs(item.key) + '\')">📋</button></td>';
      h += '<td><button class="btn btn-primary btn-sm" onclick="openEditModal(\'' + escJs(item.key) + '\',\'' + escJs(item.value) + '\')">编辑</button></td></tr>';
    });
    h += '</table>';
  } else { h += '<tr><td colspan="4" style="color:#999">暂无配置项</td></tr></table>'; }
  h += '<div class="card mt12"><h3>➕ 新增</h3><div style="font-size:11px;color:#999;margin-bottom:4px">写入 etcd: <code>' + escHtml(prefix) + '&lt;key&gt;</code></div>';
  h += '<input id="newKey" placeholder="key (如 https_settings)" class="mb8">';
  h += '<textarea id="newVal" rows="4" placeholder="value (JSON)" class="mb8"></textarea>';
  h += '<button class="btn btn-primary" onclick="addConfig()">新增</button></div>';
  h += modalHtml();
  document.getElementById('content').innerHTML = h;
  if (selectedType !== 'ALL') fillNodeSelect(selectedType);
}

function modalHtml() {
  var h = '<div id="editModal" class="modal"><div class="modal-content"><h3>✏ 编辑</h3>';
  h += '<label class="mb8">Key:</label><input id="editKey" readonly class="mb8" style="background:#f5f5f5">';
  h += '<label class="mb8">Value:</label><textarea id="editVal" rows="8" class="mb8" style="font-family:monospace"></textarea>';
  h += '<div class="flex"><button class="btn btn-primary" onclick="saveEdit()">💾 保存</button>';
  h += '<button class="btn" onclick="closeModal()" style="background:#ddd">取消</button></div></div></div>';
  h += '<div id="versionModal" class="modal"><div class="modal-content"><h3>📋 版本历史</h3><div id="versionList"></div>';
  h += '<button class="btn mt12" onclick="closeVersionModal()" style="background:#ddd">关闭</button></div></div>';
  return h;
}

async function fillNodeSelect(type) {
  var d = await etcdPost('/v3/kv/range', {
    key: b64Encode('/thunder/registry/' + type + '/'),
    range_end: b64Encode('/thunder/registry/' + type + '0')
  });
  var sel = document.getElementById('nodeSelect');
  if (!sel || !d || !d.kvs) return;
  d.kvs.forEach(function(kv) {
    var addr = b64Decode(kv.key).replace('/thunder/registry/' + type + '/', '');
    var opt = document.createElement('option');
    opt.value = addr; opt.textContent = addr;
    if (addr === selectedNode) opt.selected = true;
    sel.appendChild(opt);
  });
}

function onTypeChange() {
  selectedType = document.getElementById('typeSelect').value;
  selectedNode = '';
  loadConfig();
}
function onNodeChange() {
  selectedNode = document.getElementById('nodeSelect').value;
  loadConfig();
}

function openEditModal(key, val) {
  document.getElementById('editKey').value = key;
  document.getElementById('editVal').value = val;
  document.getElementById('editModal').style.display = 'flex';
  document.getElementById('editVal').focus();
}
function closeModal() { document.getElementById('editModal').style.display = 'none'; }
function closeVersionModal() { document.getElementById('versionModal').style.display = 'none'; }

async function saveEdit() {
  const key = document.getElementById('editKey').value;
  const val = document.getElementById('editVal').value;
  if (!key || !val) { toast('Key 和 Value 不能为空', false); return; }
  // 1. 读旧值存历史
  const oldR = await etcdPost('/v3/kv/range', {key: b64Encode(key)});
  if (oldR && oldR.kvs && oldR.kvs.length > 0) {
    const oldVal = b64Decode(oldR.kvs[0].value);
    if (oldVal) {
      const ts = Date.now();
      await etcdPost('/v3/kv/put', {
        key: b64Encode('/thunder/config_history/' + key + '/v' + ts),
        value: b64Encode(oldVal)
      });
    }
  }
  // 2. 写新值
  const r = await etcdPost('/v3/kv/put', {key: b64Encode(key), value: b64Encode(val)});
  if (r) { toast('配置已保存', true); closeModal(); loadConfig(); }
  else { toast('保存失败', false); }
}

function configPrefix() {
  return selectedType === 'ALL' ? '/thunder/config/' : '/thunder/config/' + selectedType + '/' + (selectedNode || '');
}
async function addConfig() {
  var k = document.getElementById('newKey').value.trim();
  var v = document.getElementById('newVal').value.trim();
  if (!k || !v) { toast('Key/Value 不能为空', false); return; }
  var fullKey = configPrefix() + k;
  var r = await etcdPost('/v3/kv/put', {key: b64Encode(fullKey), value: b64Encode(v)});
  if (r) { toast('已保存', true); loadConfig(); }
  else { toast('失败', false); }
}

// ── 版本历史 & 回滚 ──
async function showVersions(key) {
  const d = await etcdPost('/v3/kv/range', {
    key: b64Encode('/thunder/config_history/' + key + '/'),
    range_end: b64Encode('/thunder/config_history/' + key + '0')
  });
  let h = '<p style="font-size:12px;font-family:monospace;word-break:break-all">' + escHtml(key) + '</p><hr class="mb8">';
  if (d && d.kvs && d.kvs.length > 0) {
    h += '<table><tr><th>版本</th><th>值 (预览)</th><th>操作</th></tr>';
    d.kvs.forEach(kv => {
      const vk = b64Decode(kv.key).replace('/thunder/config_history/' + key + '/', '');
      const vv = b64Decode(kv.value);
      const preview = vv.length > 60 ? vv.substring(0,60) + '...' : vv;
      h += '<tr><td style="font-size:11px;font-family:monospace">' + escHtml(vk) + '</td>';
      h += '<td style="font-size:12px">' + escHtml(preview) + '</td>';
      h += '<td><button class="btn btn-primary btn-sm" onclick="rollback(\'' + escJs(key) + '\',\'' + escJs(b64Decode(kv.key)) + '\')">↩ 回滚</button></td></tr>';
    });
    h += '</table>';
  } else { h += '<p style="color:#999">暂无历史版本</p>'; }
  document.getElementById('versionList').innerHTML = h;
  document.getElementById('versionModal').style.display = 'flex';
}

async function rollback(key, version) {
  const shortVer = version.replace('/thunder/config_history/'+key+'/','');
  if (!confirm('确要回滚到版本 ' + shortVer + ' ?')) return;
  const d = await etcdPost('/v3/kv/range', {key: b64Encode(version)});
  if (!d || !d.kvs || d.kvs.length === 0) { toast('版本不存在', false); return; }
  const oldVal = b64Decode(d.kvs[0].value);
  const r = await etcdPost('/v3/kv/put', {key: b64Encode(key), value: b64Encode(oldVal)});
  if (r) { toast('已回滚到 ' + shortVer, true); closeVersionModal(); loadConfig(); }
  else { toast('回滚失败', false); }
}

// ── 状态 ──
async function loadStatus() {
  let etcdOk = false, etcdVer = 'N/A', nodeCount = 0, configCount = 0;
  try {
    const v = await fetch(ETCD + '/version');
    const vj = await v.json();
    etcdOk = true; etcdVer = vj.etcdserver || '?';
  } catch(e) {}
  const nr = await etcdPost('/v3/kv/range', {
    key: b64Encode('/thunder/registry/'), range_end: b64Encode('/thunder/registry0')
  });
  if (nr && nr.kvs) nodeCount = nr.kvs.length;
  const cr = await etcdPost('/v3/kv/range', {
    key: b64Encode('/thunder/config/'), range_end: b64Encode('/thunder/config0')
  });
  if (cr && cr.kvs) configCount = cr.kvs.length;

  let h = '<div class="card"><h3>📊 集群状态</h3>';
  h += '<div class="flex"><div><b>etcd:</b> <span class="badge badge-' + (etcdOk?'ok':'warn') + '">' + (etcdOk?'健康':'异常') + '</span></div>';
  h += '<div><b>版本:</b> ' + etcdVer + '</div></div>';
  h += '<div class="flex mt12"><div><b>注册节点:</b> ' + nodeCount + '</div>';
  h += '<div><b>配置项:</b> ' + configCount + '</div></div></div>';
  h += '<div class="card"><h3>🔄 自动刷新</h3><div class="flex">';
  h += '<button class="btn btn-primary" onclick="refreshAll()">🔄 立即刷新</button>';
  h += '<label><input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()"> 每 10 秒自动刷新</label></div></div>';
  document.getElementById('content').innerHTML = h;
}

function refreshAll() {
  if (currentTab === 'nodes') loadNodes();
  else if (currentTab === 'status') loadStatus();
}
let autoTimer = null;
function toggleAutoRefresh() {
  if (document.getElementById('autoRefresh').checked) {
    autoTimer = setInterval(refreshAll, 10000);
  } else { clearInterval(autoTimer); autoTimer = null; }
}

// ── Tab 切换 ──
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    this.classList.add('active');
    currentTab = this.dataset.tab;
    if (currentTab === 'nodes') loadNodes();
    else if (currentTab === 'status') loadStatus();
  });
});
loadNodes();
</script>
</body>
</html>
