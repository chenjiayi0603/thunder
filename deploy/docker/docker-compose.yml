# Thunder deploy 节点（Docker Compose）
#
# 前置：在仓库根已 cmake 安装到 deploy/（见 deploy/deploy.md），且各节点 bin/ 已存在。
#
# 用法（在 deploy/docker 目录）:
#   docker compose build
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#   ./test_interfaceserver_smoke.sh    # 宿主机 HTTP 冒烟（GenKey/VerifyKey，无需本机 Interface 二进制）
#   ./test_helloserver_smoke.sh        # 宿主机 HTTP 冒烟（Echo/HelloPool，默认无需本机 Hello 二进制）
#   ./test_helloserver_ws_smoke.sh     # WebSocket 冒烟（hello_ws 默认监听 27010，见 conf/HelloWs.json）
#
# 说明：
# - 默认 network_mode: host，与 conf 中 127.0.0.1 一致；需 Linux 宿主机（含 WSL2 上的 Docker）。
# - 卷挂载仓库根 ../../ → /thunder，以便 deploy 与 code/3party 库路径与 start.sh 一致。
# - Center 默认拉起 conf + conf2 + conf3 三实例（Raft）；健康检查等待 27000/27022/27032。
# - redis / mysql：供 Hello 模块 JSON option「TestHelloCoRedis」「TestHelloCoMysql」（默认 127.0.0.1:6379 / :3306，与 host 网络一致）。
# - start.sh 拉起守护进程后脚本会结束，故用 tail 保持容器运行；已开启 init: true 便于回收子进程。

name: thunder-deploy

x-thunder-node: &thunder-node
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  network_mode: host
  volumes:
    - ../../:/thunder:rw

services:
  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  mysql:
    image: docker.1ms.run/library/mariadb:11.2
    network_mode: host
    environment:
      MARIADB_ROOT_PASSWORD: thunder
      MARIADB_DATABASE: thunder_test
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --bind-address=127.0.0.1
      - --port=3306
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 35s

  center:
    <<: *thunder-node
    working_dir: /thunder/deploy/Center
    command:
      - bash
      - -c
      - |
        set -e
        chmod +x ./start.sh ./stop.sh 2>/dev/null || true
        ./start.sh
        exec tail -f /dev/null
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ss -tln | grep -q ':27000 ' && ss -tln | grep -q ':27022 ' && ss -tln | grep -q ':27032 '",
        ]
      interval: 3s
      timeout: 5s
      retries: 25
      start_period: 30s

  logic:
    <<: *thunder-node
    working_dir: /thunder/deploy/Logic
    depends_on:
      center:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -e
        chmod +x ./start.sh ./stop.sh 2>/dev/null || true
        ./start.sh
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q ':16068 '"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s

  hello:
    <<: *thunder-node
    working_dir: /thunder/deploy/Hello
    depends_on:
      center:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -e
        chmod +x ./start.sh ./stop.sh 2>/dev/null || true
        ./start.sh
        exec tail -f /dev/null

  hello_ws:
    <<: *thunder-node
    working_dir: /thunder/deploy/Hello
    depends_on:
      center:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -e
        chmod +x ./start_ws.sh ./stop_ws.sh ./start.sh ./stop.sh 2>/dev/null || true
        ./start_ws.sh
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q ':27010 '"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 15s

  interface:
    <<: *thunder-node
    working_dir: /thunder/deploy/Interface
    depends_on:
      center:
        condition: service_healthy
      logic:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        set -e
        chmod +x ./start.sh ./stop.sh 2>/dev/null || true
        ./start.sh
        exec tail -f /dev/null
