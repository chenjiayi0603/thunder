<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Center 管理</title>
<style>
:root{--bg:#f0f2f5;--card:#fff;--line:#e8e8e8;--primary:#1677ff;--text:#333;--muted:#666;}
*{box-sizing:border-box;}
body{font-family:system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--card);border-bottom:1px solid var(--line);padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;}
header h1{font-size:1.15rem;margin:0;font-weight:600;}
nav{display:flex;gap:.35rem;flex-wrap:wrap;}
nav button{border:1px solid var(--line);background:var(--card);padding:.45rem .85rem;border-radius:6px;cursor:pointer;font-size:.9rem;}
nav button.on{background:var(--primary);color:#fff;border-color:var(--primary);}
main{max-width:1100px;margin:0 auto;padding:1rem 1.25rem 2rem;}
.panel{display:none;}
.panel.on{display:block;}
.card{background:var(--card);border-radius:8px;border:1px solid var(--line);padding:1rem;margin-bottom:1rem;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.card h2{font-size:1rem;margin:0 0 .75rem;}
.toolbar{display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem;flex-wrap:wrap;}
input[type=text]{padding:.4rem .55rem;min-width:200px;border:1px solid #ccc;border-radius:4px;}
button.action{padding:.4rem .75rem;cursor:pointer;border-radius:4px;border:1px solid var(--primary);background:var(--primary);color:#fff;}
button.secondary{background:var(--card);color:var(--text);border-color:#d9d9d9;}
table{width:100%;border-collapse:collapse;}
th,td{padding:.55rem .65rem;text-align:left;border-bottom:1px solid var(--line);}
th{background:#fafafa;font-weight:600;font-size:.85rem;}
.err{color:#c00;margin:.4rem 0;font-size:.9rem;}
#detail{margin-top:.75rem;padding:.75rem;background:#fafafa;border-radius:6px;border:1px solid var(--line);display:none;}
#detail pre{margin:0;white-space:pre-wrap;font-size:12px;max-height:320px;overflow:auto;}
#detail .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem;}
textarea{width:100%;min-height:9rem;font-family:ui-monospace,monospace;font-size:12px;padding:.5rem;border:1px solid #ccc;border-radius:4px;}
.preset{margin:.5rem 0;display:flex;flex-wrap:wrap;gap:.35rem;}
.preset button{font-size:.8rem;padding:.3rem .5rem;}
.note{color:var(--muted);font-size:.85rem;margin:0 0 .75rem;line-height:1.45;}
#outJson{background:#fafafa;padding:.75rem;border-radius:4px;overflow:auto;max-height:280px;white-space:pre-wrap;font-size:12px;margin-top:.5rem;}
</style>
</head>
<body>
<header>
<h1>Center 管理</h1>
<nav id="tabs">
<button type="button" class="on" data-panel="p1">服务列表</button>
<button type="button" data-panel="p2">集群命令（JSON）</button>
</nav>
</header>
<main>
<section id="p1" class="panel on">
<p class="note">按 <code>node_type</code> 聚合在线节点；详情为节点上报 JSON。无鉴权，仅供内网调试。</p>
<div class="card">
<h2>筛选</h2>
<div class="toolbar">
<label>服务名称 <input type="text" id="q" placeholder="请输入服务名称"/></label>
<button type="button" class="action" id="btnQ">查询</button>
<button type="button" class="secondary" id="btnAll">显示全部</button>
</div>
<div id="err1" class="err"></div>
<table>
<thead><tr>
<th>服务名</th><th>集群数目</th><th>实例数</th><th>健康实例数</th><th>操作</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
<div id="detail">
<div class="hd"><strong>详情</strong><button type="button" class="secondary" id="btnClose">关闭</button></div>
<pre id="detailPre"></pre>
</div>
</div>
</section>

<section id="p2" class="panel">
<p class="note">与原先 POST <code>/admin</code> 相同：<code>cmd</code> 为 show / get / set，参数在 <code>args</code> 数组。get/set 可能由 Step 异步回写 HTTP 响应。</p>
<div class="card">
<h2>快捷模板</h2>
<div class="preset">
<button type="button" data-json='{"cmd":"show","args":["center"]}'>show center</button>
<button type="button" data-json='{"cmd":"show","args":["nodes"]}'>show nodes</button>
<button type="button" data-json='{"cmd":"show","args":["ip_white"]}'>show ip_white</button>
<button type="button" data-json='{"cmd":"show","args":["subscription"]}'>show subscription</button>
</div>
<label>请求 JSON</label>
<textarea id="req"></textarea>
<div class="toolbar" style="margin-top:.5rem;">
<button type="button" class="action" id="send">发送到 POST /admin</button>
<span id="st"></span>
</div>
<pre id="outJson"></pre>
</div>
</section>
</main>
<script>
(function(){
var API='/admin';
document.getElementById('tabs').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-panel]');if(!b)return;
  var id=b.getAttribute('data-panel');
  document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('on',x===b);});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id===id);});
});
/* --- 服务列表 --- */
var rows=document.getElementById('rows'), err1=document.getElementById('err1'),
    q=document.getElementById('q'), detail=document.getElementById('detail'),
    detailPre=document.getElementById('detailPre');
function setErr1(t){err1.textContent=t||'';}
function render(data){
  rows.innerHTML='';
  if(!data||!data.length){return;}
  data.forEach(function(r){
    var tr=document.createElement('tr');
    tr.innerHTML='<td>'+escapeHtml(r.serviceName)+'</td><td>'+r.clusterCount+'</td><td>'+
      r.instanceCount+'</td><td>'+r.healthyInstanceCount+'</td><td><button type="button" class="detail-btn action" style="padding:.25rem .5rem;font-size:.8rem;" data-t="'+
      escapeAttr(r.serviceName)+'">详情</button></td>';
    rows.appendChild(tr);
  });
  rows.querySelectorAll('.detail-btn').forEach(function(b){
    b.addEventListener('click',function(){loadDetail(b.getAttribute('data-t'));});
  });
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function loadList(name){
  setErr1('');
  var url=API+'/api/services'+(name?'?name='+encodeURIComponent(name):'');
  fetch(url).then(function(r){return r.text().then(function(t){return {ok:r.ok,status:r.status,t:t};});})
  .then(function(x){
    if(!x.ok){setErr1('HTTP '+x.status+': '+x.t);return;}
    try{var j=JSON.parse(x.t);if(j.code!==0){setErr1(j.msg||'错误');return;}
      render(j.data||[]);
    }catch(e){setErr1(String(e));}
  }).catch(function(e){setErr1(String(e));});
}
function loadDetail(type){
  setErr1('');
  fetch(API+'/api/service/detail?type='+encodeURIComponent(type))
  .then(function(r){return r.text().then(function(t){return {ok:r.ok,t:t};});})
  .then(function(x){
    try{var j=JSON.parse(x.t);
      if(!x.ok||j.code!==0){detailPre.textContent=x.t;detail.style.display='block';return;}
      detailPre.textContent=JSON.stringify(j.data,null,2);
      detail.style.display='block';
    }catch(e){detailPre.textContent=x.t;detail.style.display='block';}
  }).catch(function(e){setErr1(String(e));});
}
document.getElementById('btnQ').addEventListener('click',function(){loadList(q.value.trim());});
document.getElementById('btnAll').addEventListener('click',function(){q.value='';loadList('');});
document.getElementById('btnClose').addEventListener('click',function(){detail.style.display='none';});
loadList('');
/* --- JSON 命令 --- */
var req=document.getElementById('req'), out=document.getElementById('outJson'), st=document.getElementById('st');
req.value='{"cmd":"show","args":["center"]}';
document.querySelectorAll('.preset button[data-json]').forEach(function(b){
  b.addEventListener('click',function(){req.value=b.getAttribute('data-json');});
});
document.getElementById('send').addEventListener('click',function(){
  st.textContent='请求中…'; out.textContent=''; out.className='';
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:req.value})
    .then(function(r){return r.text().then(function(t){return {r:r,t:t};});})
    .then(function(x){
      st.textContent=x.r.ok?('OK '+x.r.status):('HTTP '+x.r.status);
      try{out.textContent=JSON.stringify(JSON.parse(x.t),null,2);}
      catch(e){out.textContent=x.t;}
    })
    .catch(function(e){st.textContent=''; out.className='err'; out.textContent=String(e);});
});
})();
</script>
</body>
</html>
