[pytest]
addopts = -ra
testpaths = .
markers =
    integration: integration tests requiring running services
    smoke: end-to-end smoke chain checks
    perf: performance tests (wrk)
    ws: websocket tests
    raft: multicenter raft tests
    route: interface route-chain tests
    watch: etcd Watch behavior tests (PUT/DELETE propagation, reconnect)
    stability: etcd full-chain stability tests (registration/deregister/TTL/restart)
    slow: long-running or destructive tests (S4 TTL ~40s, S6 long-run 5min)

