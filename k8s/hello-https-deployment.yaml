apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-hello-https
  namespace: thunder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thunder-hello-https
  template:
    metadata:
      labels:
        app: thunder-hello-https
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: app
        image: ubuntu:26.04
        imagePullPolicy: IfNotPresent
        workingDir: /thunder/deploy/HelloHttps
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: LD_LIBRARY_PATH
          value: "/thunder/build/lib:/thunder/deploy/3lib:/thunder/code/3party/lib"
        - name: DEBIAN_FRONTEND
          value: noninteractive
        command:
        - bash
        - -c
        - |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates net-tools procps iproute2 libjemalloc2 libbrotli1 libsnappy1v5 liburing2 2>/dev/null
          chmod +x ./node.sh 2>/dev/null || true
          ./scripts/gen_self_signed_https_cert.sh 2>/dev/null || true
          mkdir -p /tmp/conf && cp /thunder/k8s/conf/HelloHttps.json /tmp/conf/HelloHttps.json && sed -i "s|0.0.0.0|$POD_IP|g" /tmp/conf/HelloHttps.json
          LD_LIBRARY_PATH=$LD_LIBRARY_PATH bin/HelloHttps /tmp/conf/HelloHttps.json
          exec tail -f /dev/null
        ports:
        - containerPort: 27443
        volumeMounts:
        - name: thunder-repo
          mountPath: /thunder
        - name: thunder-plugins
          mountPath: /thunder/deploy/HelloHttps/plugins
          subPath: HelloHttps
          readOnly: true
      volumes:
      - name: thunder-repo
        hostPath:
          path: /home/tommychen/thunder
      - name: thunder-plugins
        persistentVolumeClaim:
          claimName: thunder-plugins
---
apiVersion: v1
kind: Service
metadata:
  name: thunder-hello-https
  namespace: thunder
spec:
  type: NodePort
  ports:
  - port: 27443
    nodePort: 30043
  selector:
    app: thunder-hello-https
