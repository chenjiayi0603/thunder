apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-interface
  namespace: thunder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thunder-interface
  template:
    metadata:
      labels:
        app: thunder-interface
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: app
        image: thunder-interface:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_VERSION
          value: "v1"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        ports:
        - containerPort: 27008
        - containerPort: 27009
