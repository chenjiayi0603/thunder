apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-interface
  namespace: thunder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thunder-interface
  template:
    metadata:
      labels:
        app: thunder-interface
    spec:
      containers:
      - name: app
        image: ubuntu:26.04
        imagePullPolicy: IfNotPresent
        workingDir: /thunder/deploy/Interface
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: LD_LIBRARY_PATH
          value: "/thunder/build/lib:/thunder/deploy/3lib:/thunder/code/3party/lib"
        - name: DEBIAN_FRONTEND
          value: noninteractive
        command:
        - bash
        - -c
        - |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates net-tools procps iproute2 libjemalloc2 libbrotli1 libsnappy1v5 liburing2 2>/dev/null
          chmod +x ./node.sh 2>/dev/null || true
          mkdir -p /tmp/conf && cp /thunder/k8s/conf/Interface.json /tmp/conf/Interface.json && sed -i "s|0.0.0.0|$POD_IP|g" /tmp/conf/Interface.json
          LD_LIBRARY_PATH=$LD_LIBRARY_PATH bin/Interface /tmp/conf/Interface.json
          exec tail -f /dev/null
        ports:
        - containerPort: 27008
        volumeMounts:
        - name: thunder-repo
          mountPath: /thunder
      volumes:
      - name: thunder-repo
        hostPath:
          path: /home/tommychen/thunder
---
apiVersion: v1
kind: Service
metadata:
  name: thunder-interface
  namespace: thunder
spec:
  type: NodePort
  ports:
  - port: 27008
    nodePort: 30008
  selector:
    app: thunder-interface
