apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-interface
  namespace: thunder
  labels:
    thunder.io/role: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thunder-interface
  template:
    metadata:
      labels:
        app: thunder-interface
    spec:
      containers:
      - name: hello
        image: thunder-node:latest
        imagePullPolicy: Never
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        command: ["bash", "-c", "chmod +x ./node.sh 2>/dev/null; LD_LIBRARY_PATH=/thunder/code/3party/lib:/thunder/build/lib ./node.sh start; exec tail -f /dev/null"]
        workingDir: /thunder/deploy/Interface
        ports:
        - containerPort: 27008
        volumeMounts:
        - name: thunder-repo
          mountPath: /thunder
      volumes:
      - name: thunder-repo
        hostPath:
          path: /home/tommychen/thunder
---
apiVersion: v1
kind: Service
metadata:
  name: thunder-interface
  namespace: thunder
spec:
  type: NodePort
  ports:
  - port: 27008
    nodePort: 30008
  selector:
    app: thunder-interface
