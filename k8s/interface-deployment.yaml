apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-interface
  namespace: thunder
spec:
  replicas: 1
  # --- Recreate: hostNetwork pod 无法滚动更新 (端口冲突) (#154) ---
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: thunder-interface
  template:
    metadata:
      labels:
        app: thunder-interface
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # sysctls 不能与 hostNetwork 同时使用 (K8s 限制)
      # TCP buffer 优化由 Node 级 sysctl (k8s/init-k8s-node.sh) 统一管理
      containers:
      - name: app
        image: localhost:5000/thunder-interface:latest
        imagePullPolicy: IfNotPresent
        # Worker daemon 死亡即 NotReady (#164); 进程名 <server_name>_Loader/_W<n>
        readinessProbe:
          exec:
            command: ["pgrep", "-f", "Interface_robot_"]
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: NODE_VERSION
          value: "v1"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: ETCD_ENDPOINT
          value: "http://thunder-etcd.thunder:2379"
        - name: INNER_PORT
          value: "27009"
        # --- io_uring 需要 memlock (#154) ---
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
        # --- Burstable QoS — 内存不封顶, CPU 保证 ---
        resources:
          requests:
            cpu: "2"
            memory: "128Mi"
          limits:
            cpu: "2"
        ports:
        - containerPort: 27008
        - containerPort: 27009
