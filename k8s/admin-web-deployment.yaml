apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-admin-web
  namespace: thunder
  labels:
    app: thunder-admin-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thunder-admin-web
  template:
    metadata:
      labels:
        app: thunder-admin-web
    spec:
      containers:
      - name: app
        image: thunder-admin-web:latest
        imagePullPolicy: IfNotPresent
        workingDir: /app
        ports:
        - containerPort: 8090
        volumeMounts:
        - name: nfs-plugins
          mountPath: /data/thunder/plugins
      volumes:
      - name: nfs-plugins
        persistentVolumeClaim:
          claimName: thunder-plugins
---
apiVersion: v1
kind: Service
metadata:
  name: thunder-admin-web
  namespace: thunder
spec:
  type: NodePort
  selector:
    app: thunder-admin-web
  ports:
  - port: 8090
    targetPort: 8090
    nodePort: 30090
