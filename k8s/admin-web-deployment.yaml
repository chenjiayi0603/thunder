apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-admin-web
  namespace: thunder
  labels:
    app: thunder-admin-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thunder-admin-web
  template:
    metadata:
      labels:
        app: thunder-admin-web
    spec:
      serviceAccountName: thunder-admin-web
      containers:
      - name: app
        image: localhost:5000/thunder-admin-web:latest
        imagePullPolicy: IfNotPresent
        # --- 资源请求/限制 (非 Guaranteed QoS, admin 不绑核) ---
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "500m"
        workingDir: /app
        env:
        - name: ETCD_ENDPOINTS
          value: "http://thunder-etcd-0.thunder-etcd.thunder:2379,http://thunder-etcd-1.thunder-etcd.thunder:2379,http://thunder-etcd-2.thunder-etcd.thunder:2379"
        # MinIO Console 反向代理目标 (默认使用集群内 DNS, 本地开发可设 http://192.168.3.61:30091)
        - name: MINIO_CONSOLE_URL
          value: "http://thunder-minio.thunder:9001"
        ports:
        - containerPort: 8090
        volumeMounts:
        - name: admin-data
          mountPath: /app/data
      volumes:
      - name: admin-data
        persistentVolumeClaim:
          claimName: thunder-admin-web
---
apiVersion: v1
kind: Service
metadata:
  name: thunder-admin-web
  namespace: thunder
spec:
  type: NodePort
  selector:
    app: thunder-admin-web
  ports:
  - port: 8090
    targetPort: 8090
    nodePort: 30090
