apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-mqtt-broker
  namespace: thunder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: thunder-mqtt-broker
  template:
    metadata:
      labels:
        app: thunder-mqtt-broker
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: app
        image: localhost:5000/thunder-mqtt-broker:latest
        imagePullPolicy: IfNotPresent
        readinessProbe:
          tcpSocket:
            port: 21883
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: ETCD_ENDPOINT
          value: "http://thunder-etcd.thunder:2379"
        command:
        - /bin/bash
        - -c
        - |
          cd /app
          exec ./entrypoint.sh
        resources:
          requests:
            cpu: "500m"
            memory: "64Mi"
          limits:
            cpu: "500m"
        ports:
        - containerPort: 21883
        - containerPort: 21884
---
apiVersion: v1
kind: Service
metadata:
  name: thunder-mqtt-broker
  namespace: thunder
spec:
  type: NodePort
  selector:
    app: thunder-mqtt-broker
  ports:
  - name: mqtt
    port: 21883
    targetPort: 21883
    nodePort: 31883
