# PV + PVC — NFSv4 共享存储
# nfs-server Pod (hostNetwork) 提供 NFS 服务
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-thunder-plugins
spec:
  accessModes: [ReadWriteMany]
  capacity: {storage: 10Gi}
  mountOptions: [nfsvers=4]
  nfs:
    server: 192.168.3.61
    path: /
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thunder-plugins
  namespace: thunder
spec:
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 10Gi}}
  volumeName: pv-thunder-plugins
