apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-hello-wss
  namespace: thunder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thunder-hello-wss
  template:
    metadata:
      labels:
        app: thunder-hello-wss
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: app
        image: thunder-hello-wss:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_VERSION
          value: "v1"
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: ETCD_ENDPOINT
          value: "http://thunder-etcd.thunder:2379"
        ports:
        - containerPort: 27012
        - containerPort: 27013
