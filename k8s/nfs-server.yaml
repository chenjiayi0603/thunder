apiVersion: v1
kind: Pod
metadata:
  name: nfs-server
  namespace: thunder
  labels:
    app: nfs-server
spec:
  containers:
  - name: nfs
    image: itsthenetwork/nfs-server-alpine:latest
    env:
    - name: SHARED_DIRECTORY
      value: /exports
    ports:
    - containerPort: 2049
    securityContext:
      privileged: true
    volumeMounts:
    - name: data
      mountPath: /exports
  volumes:
  - name: data
    hostPath:
      path: /data/thunder/plugins
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: thunder
spec:
  selector:
    app: nfs-server
  ports:
  - port: 2049
    targetPort: 2049
