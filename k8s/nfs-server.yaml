# NFS Server — K8s 原生 Pod (hostNetwork), 替代 apt nfs-kernel-server
# PV 用 server: 192.168.3.61 不变, 此 Pod 接管 2049 端口
apiVersion: v1
kind: Pod
metadata:
  name: nfs-server
  namespace: thunder
  labels:
    app: nfs-server
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  containers:
  - name: nfs
    image: itsthenetwork/nfs-server-alpine:latest
    imagePullPolicy: IfNotPresent
    env:
    - name: SHARED_DIRECTORY
      value: /exports
    ports:
    - containerPort: 2049
      hostPort: 2049
    securityContext:
      privileged: true
    volumeMounts:
    - name: data
      mountPath: /exports
  volumes:
  - name: data
    hostPath:
      path: /data/thunder/plugins
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: thunder
spec:
  selector:
    app: nfs-server
  ports:
  - port: 2049
    targetPort: 2049
