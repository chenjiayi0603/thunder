apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-hello
  namespace: thunder
  labels:
    app: thunder-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thunder-hello
  template:
    metadata:
      labels:
        app: thunder-hello
    spec:
      containers:
      - name: hello
        image: ubuntu:26.04
        workingDir: /thunder/deploy/HelloHttp
        command: ["bash", "-c", "./node.sh start && tail -f /dev/null"]
        ports:
        - containerPort: 27006
        volumeMounts:
        - name: thunder-repo
          mountPath: /thunder
        - name: nfs-plugins
          mountPath: /thunder/deploy/HelloHttp/plugins
          subPath: HelloHttp
      volumes:
      - name: thunder-repo
        hostPath:
          path: /thunder
      - name: nfs-plugins
        persistentVolumeClaim:
          claimName: thunder-plugins
---
apiVersion: v1
kind: Service
metadata:
  name: thunder-hello
  namespace: thunder
spec:
  type: NodePort
  selector:
    app: thunder-hello
  ports:
  - port: 27006
    targetPort: 27006
    nodePort: 30006
