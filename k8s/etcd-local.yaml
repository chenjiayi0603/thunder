apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-etcd
  namespace: thunder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thunder-etcd
  template:
    metadata:
      labels:
        app: thunder-etcd
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.21
        imagePullPolicy: IfNotPresent
        command:
        - etcd
        - --name=etcd1
        - --data-dir=/etcd-data
        - --listen-client-urls=http://0.0.0.0:2379
        - --advertise-client-urls=http://127.0.0.1:2379
        - --enable-v2=false
        ports:
        - containerPort: 2379
        volumeMounts:
        - name: data
          mountPath: /etcd-data
      volumes:
      - name: data
        hostPath:
          path: /tmp/thunder-etcd-data
---
apiVersion: v1
kind: Service
metadata:
  name: thunder-etcd
  namespace: thunder
spec:
  ports:
  - port: 2379
  selector:
    app: thunder-etcd
