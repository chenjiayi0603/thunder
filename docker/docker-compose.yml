# Thunder deploy 节点（Docker Compose）
#
# 前置：在仓库根已 cmake 安装到 deploy/（见 deploy/deploy.md），且各节点 bin/ 已存在。
#
# 用法（在 docker/ 目录）:
#   docker compose build
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#   ./dev_up_logs.sh                     # 一键构建/启动/日志 或 仓库根 ./deploy.sh up
#
# 说明：
# - 默认 network_mode: host，与 conf 中 127.0.0.1 一致；需 Linux 宿主机（含 WSL2 上的 Docker）。
# - 卷挂载仓库根 ../ → /thunder，以便 deploy 与 code/3party 库路径与 start.sh 一致。
# - 本地集成测试默认仅拉起单 Center（conf）；健康检查等待 27000。
# - redis / mysql：供 Hello 模块 JSON option「TestHelloCoRedis」「TestHelloCoMysql」（默认 127.0.0.1:6379 / :3306，与 host 网络一致）。
# - start.sh 拉起守护进程后脚本会结束，故用 tail -f /dev/null 保持容器运行；已开启 init: true 便于回收子进程。
#
# 资源（与常见编排一致：limits 防拖垮宿主机 + 进程内上限与容器 memory 对齐）:
# - 下列 limits 按「探测样机 ≈16G RAM / 28 CPU」设比例尺；总内存上限约 9G，留足宿主机与其它进程。
# - 小内存机器请同比缩小各 memory / Redis maxmemory / innodb-buffer-pool-size。
# - deploy.resources 由 Docker Compose v2+ 在 docker compose up 时下发给运行时（非仅 Swarm）。

name: thunder-deploy

# x- 前缀：扩展片段，不作为独立 service；&thunder-node 为锚点，供各业务服务 <<: 合并复用。
x-thunder-node: &thunder-node
  build:
    context: . # 即 docker/
    dockerfile: Dockerfile
  init: true # PID1 用 init，便于回收子进程（start.sh 拉起守护进程后 tail 常驻）
  network_mode: host # 与 conf 里 127.0.0.1 端口一致，监听在宿主机而非 bridge
  security_opt:
    - seccomp:unconfined # 允许 io_uring 等高级 syscall (asio_uring 后端需要)
  volumes:
    - ../:/thunder:rw # 仓库根挂载，与宿主机 deploy、code/3party、编译产物路径一致

# 网络服务常见：提高句柄上限，避免高并发时 accept 失败
x-thunder-ulimits: &thunder-ulimits
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
    memlock:
      soft: 67108864
      hard: 67108864

# etcd 节点公共配置（YAML 锚点），仅用于 merge，不作为服务启动
x-etcd-common: &etcd-common
  image: quay.io/coreos/etcd:v3.5.21
  network_mode: host
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M
      reservations:
        memory: 64M

services:
  redis:
    image: redis:7-alpine
    network_mode: host
    volumes:
      - ./data/redis:/data
    # maxmemory 须低于下方 deploy memory，避免 Redis 与 cgroup 双头限死或 OOM 行为难预期
    command:
      - redis-server
      - --bind
      - "127.0.0.1"
      - --port
      - "6379"
      - --maxmemory
      - "384mb"
      - --maxmemory-policy
      - allkeys-lru
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  mysql:
    image: mariadb:11.2
    network_mode: host
    volumes:
      - ./data/mariadb:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: thunder
      MARIADB_DATABASE: thunder_test
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --bind-address=127.0.0.1
      - --port=3306
      # 缓冲池显著小于容器 memory，余量给连接/临时表与系统开销
      - --innodb-buffer-pool-size=512M
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 35s

  # 3 节点 etcd Raft 集群（Phase C）
  # - 客户端端口: etcd1=2379, etcd2=2381, etcd3=2383
  # - Peer 端口:  etcd1=2380, etcd2=2382, etcd3=2384
  # - Thunder 服务连接 etcd1 (port 2379)；集群内部自动转发到 leader
  # - 初次启动前务必清空旧数据: rm -rf docker/data/etcd{1,2,3}
  etcd1:
    <<: *etcd-common
    environment:
      ETCD_NAME: etcd1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://127.0.0.1:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379
      ETCD_LISTEN_PEER_URLS: http://127.0.0.1:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://127.0.0.1:2380
      ETCD_INITIAL_CLUSTER: "etcd1=http://127.0.0.1:2380,etcd2=http://127.0.0.1:2382,etcd3=http://127.0.0.1:2384"
      ETCD_INITIAL_CLUSTER_TOKEN: thunder-etcd-cluster
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: "1"
      ETCD_ENABLE_V2: "false"
    volumes:
      - ./data/etcd1:/etcd-data
    # etcd distroless 镜像无 shell，用 etcdctl CMD 形式。
    # endpoint health 需要集群 quorum，三节点全部加入后才 healthy。
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  etcd2:
    <<: *etcd-common
    environment:
      ETCD_NAME: etcd2
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://127.0.0.1:2381
      ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2381
      ETCD_LISTEN_PEER_URLS: http://127.0.0.1:2382
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://127.0.0.1:2382
      ETCD_INITIAL_CLUSTER: "etcd1=http://127.0.0.1:2380,etcd2=http://127.0.0.1:2382,etcd3=http://127.0.0.1:2384"
      ETCD_INITIAL_CLUSTER_TOKEN: thunder-etcd-cluster
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: "1"
      ETCD_ENABLE_V2: "false"
    volumes:
      - ./data/etcd2:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2381", "endpoint", "health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  etcd3:
    <<: *etcd-common
    environment:
      ETCD_NAME: etcd3
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://127.0.0.1:2383
      ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2383
      ETCD_LISTEN_PEER_URLS: http://127.0.0.1:2384
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://127.0.0.1:2384
      ETCD_INITIAL_CLUSTER: "etcd1=http://127.0.0.1:2380,etcd2=http://127.0.0.1:2382,etcd3=http://127.0.0.1:2384"
      ETCD_INITIAL_CLUSTER_TOKEN: thunder-etcd-cluster
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_AUTO_COMPACTION_MODE: periodic
      ETCD_AUTO_COMPACTION_RETENTION: "1"
      ETCD_ENABLE_V2: "false"
    volumes:
      - ./data/etcd3:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2383", "endpoint", "health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s


  logic:
    <<: [*thunder-node, *thunder-ulimits]
    working_dir: /thunder/deploy/Logic
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      etcd1:
        condition: service_healthy
    stop_grace_period: 30s
    command:
      - bash
      - -c
      - |
        set -e
        chmod +x ./node.sh 2>/dev/null || true
        ./node.sh start
        trap './node.sh stop --yes' TERM INT
        tail -f /dev/null &
        wait $! || true
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1536M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q ':16068 '"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s

  hello:
    <<: [*thunder-node, *thunder-ulimits]
    working_dir: /thunder/deploy/HelloHttp
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      etcd1:
        condition: service_healthy
    stop_grace_period: 30s
    command:
      - bash
      - -c
      - |
        set -e
        chmod +x ./node.sh 2>/dev/null || true
        ./node.sh start
        trap './node.sh stop' TERM INT
        tail -f /dev/null &
        wait $! || true
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1G
        reservations:
          memory: 128M

  hello_ws:
    <<: [*thunder-node, *thunder-ulimits]
    working_dir: /thunder/deploy/HelloWs
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      etcd1:
        condition: service_healthy
    stop_grace_period: 30s
    command:
      - bash
      - -c
      - |
        set -e
        chmod +x ./node.sh 2>/dev/null || true
        ./node.sh start
        trap './node.sh stop' TERM INT
        tail -f /dev/null &
        wait $! || true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q ':27010 '"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 15s

  hello_https:
    <<: [*thunder-node, *thunder-ulimits]
    working_dir: /thunder/deploy/HelloHttps
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      etcd1:
        condition: service_healthy
    stop_grace_period: 30s
    command:
      - bash
      - -c
      - |
        set -e
        chmod +x ./node.sh ./scripts/gen_self_signed_https_cert.sh 2>/dev/null || true
        ./scripts/gen_self_signed_https_cert.sh || true
        ./node.sh start
        trap './node.sh stop' TERM INT
        tail -f /dev/null &
        wait $! || true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "ss -tln | grep -q ':27443 '"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 15s

  interface:
    <<: [*thunder-node, *thunder-ulimits]
    working_dir: /thunder/deploy/Interface
    depends_on:
      logic:
        condition: service_healthy
      etcd1:
        condition: service_healthy
    stop_grace_period: 30s
    command:
      - bash
      - -c
      - |
        set -e
        chmod +x ./node.sh 2>/dev/null || true
        ./node.sh start
        trap './node.sh stop --yes' TERM INT
        tail -f /dev/null &
        wait $! || true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 128M
