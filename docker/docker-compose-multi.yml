# Thunder 多服务器部署
# 用法:
#   服务器1: docker compose -f docker-compose-multi.yml up logic etcd redis mysql
#   服务器2: docker compose -f docker-compose-multi.yml up interface hello hello_ws hello_https
#
# 前提: 服务器间网络互通, 配置 etcd_endpoints 指向服务器1的 IP

x-thunder-node: &thunder-node
  build:
    context: .
    dockerfile: Dockerfile
  init: true
  network_mode: host
  security_opt:
    - seccomp:unconfined
  volumes:
    - ../:/thunder:rw

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    network_mode: host
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://SERVER1_IP:2379
      - --enable-v2=false
    volumes:
      - ./data/etcd:/etcd-data

  redis:
    image: redis:7-alpine
    network_mode: host

  mysql:
    image: mariadb:11.2
    network_mode: host
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: thunder

  logic:
    <<: [*thunder-node]
    working_dir: /thunder/deploy/Logic
    command:
      - bash
      - -c
      - |
        chmod +x ./node.sh 2>/dev/null || true
        ./node.sh start
        exec tail -f /dev/null

  interface:
    <<: [*thunder-node]
    working_dir: /thunder/deploy/Interface
    command:
      - bash
      - -c
      - |
        chmod +x ./node.sh 2>/dev/null || true
        ./node.sh start
        exec tail -f /dev/null

  hello:
    <<: [*thunder-node]
    working_dir: /thunder/deploy/HelloHttp
    command:
      - bash
      - -c
      - |
        chmod +x ./node.sh 2>/dev/null || true
        ./node.sh start
        exec tail -f /dev/null

  hello_ws:
    <<: [*thunder-node]
    working_dir: /thunder/deploy/HelloWs
    command:
      - bash
      - -c
      - |
        chmod +x ./node.sh 2>/dev/null || true
        ./node.sh start
        exec tail -f /dev/null

  hello_https:
    <<: [*thunder-node]
    working_dir: /thunder/deploy/HelloHttps
    command:
      - bash
      - -c
      - |
        chmod +x ./node.sh 2>/dev/null || true
        ./node.sh start
        exec tail -f /dev/null
